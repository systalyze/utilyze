{{- if .Values.service.enabled }}
# Load-balances across node collectors; port-forward to a pod for one node.
apiVersion: v1
kind: Service
metadata:
  name: {{ include "utilyze.fullname" . }}
  labels:
    {{- include "utilyze.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: http
      protocol: TCP
  selector:
    {{- include "utilyze.selectorLabels" . | nindent 4 }}
{{- end }}
